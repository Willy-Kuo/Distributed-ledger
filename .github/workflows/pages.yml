name: Publish web dashboard

on:
  push:
    branches:
      - v3
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout v3
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Publish web folder to gh-pages
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/dashboard-pages
          mkdir -p /tmp/dashboard-pages
          cp -R web/. /tmp/dashboard-pages/
          touch /tmp/dashboard-pages/.nojekyll

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan gh-pages-work
          git rm -rf . >/dev/null 2>&1 || true
          cp -R /tmp/dashboard-pages/. .
          git add .
          git commit -m "Publish web dashboard" || exit 0
          git push --force origin HEAD:gh-pages
